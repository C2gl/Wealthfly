services:
  wealthfly:
    image: ghcr.io/c2gl/wealthfly:${WEALTHFLY_IMAGE_TAG:-latest}
    container_name: wealthfly
    restart: unless-stopped
    ports:
      - "${PORT:-4400}:4400"
    environment:
      WEALTHFLY_LANGUAGE: ${WEALTHFLY_LANGUAGE:-en}
    env_file:
      - .env
    volumes:
      - wealthfly-data:/app/data

volumes:
  wealthfly-data:
